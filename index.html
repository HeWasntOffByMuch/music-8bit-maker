<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8-bit Blues Generator</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    label { display: block; margin: 10px 0; }
    input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <h1>🎵 Infinite 8-bit Blues</h1>

  <label>Tempo (BPM): <span id="bpmVal">90</span>
    <input type="range" id="bpm" min="60" max="180" value="90">
  </label>

  <label>Key:
    <select id="key">
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
      <option value="A">A</option>
      <option value="B">B</option>
    </select>
  </label>

  <fieldset id="motifs">
    <legend>Motifs (tick to enable)</legend>
    <label><input type="checkbox" value="0" checked> Mega Man leap</label>
    <label><input type="checkbox" value="1"> Zelda phrase</label>
    <label><input type="checkbox" value="2"> Castlevania fall</label>
    <label><input type="checkbox" value="3"> Closing lick</label>
    <label><input type="checkbox" value="4"> Major run</label>
    <label><input type="checkbox" value="5"> Balatro minor 7</label>
    <label><input type="checkbox" value="6"> Mario intro</label>
    <label><input type="checkbox" value="7"> Zelda theme</label>
    <label><input type="checkbox" value="8"> Mega Man stage</label>
    <label><input type="checkbox" value="9"> Castlevania walk</label>
    <label><input type="checkbox" value="10"> Sonic descent</label>
    <label><input type="checkbox" value="11"> Final Fantasy prelude</label>
    <label><input type="checkbox" value="12"> GTA SA groove</label>
    <label><input type="checkbox" value="13"> GTA VC sweep</label>
    <label><input type="checkbox" value="14"> GTA IV noir</label>
    <label><input type="checkbox" value="15"> GTA V cinematic</label>
    <label><input type="checkbox" value="16"> GTA classic loop</label>
    <label><input type="checkbox" value="17"> Epic hero theme (Skyrim)</label>
    <label><input type="checkbox" value="18"> Dramatic tension builder</label>
    <label><input type="checkbox" value="19"> Majestic descent</label>
    <label><input type="checkbox" value="20"> Imperial march inspired (Star Wars)</label>
    <label><input type="checkbox" value="21"> Triumphant fanfare</label>
    <label><input type="checkbox" value="22"> Epic quest theme</label>
    <label><input type="checkbox" value="23"> Adventure rising theme</label>
    <label><input type="checkbox" value="24"> Mystical arpeggiated theme</label>
    <label><input type="checkbox" value="25"> Ominous boss theme</label>
    <label><input type="checkbox" value="26"> Epic battle sequence</label>
    <label><input type="checkbox" value="27"> Rhythmic groove pattern based on onomatopoeia</label>
    <label><input type="checkbox" value="28"> Rock-inspired riff with power chord feel</label>

  </fieldset>
  <label><input type="checkbox" id="enableGeneratedTheme">Enable playing generated theme</label>
  <br>
  <label><input type="checkbox" id="useMotifGenerator" checked>Use motif generator</label>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    const socket = io('http://localhost:3000', {
      transports: ['websocket']
    });
    const bpmSlider = document.getElementById('bpm');
    const bpmVal = document.getElementById('bpmVal');
    const keySelect = document.getElementById('key');
    const motifBoxes = document.querySelectorAll('#motifs input[type=checkbox]');
    const enableGeneratedTheme = document.getElementById('enableGeneratedTheme');
    const useMotifGenerator = document.getElementById('useMotifGenerator');

    bpmSlider.oninput = () => {
      bpmVal.textContent = bpmSlider.value;
      socket.emit('bpm', parseInt(bpmSlider.value));
    };

    keySelect.onchange = () => {
      socket.emit('key', keySelect.value);
    };

    motifBoxes.forEach(box => {
      box.onchange = () => {
        console.log('Motif changed');
        const active = Array.from(motifBoxes)
          .filter(b => b.checked)
          .map(b => parseInt(b.value));
        socket.emit('motifs', active);
      };
    });

    enableGeneratedTheme.onchange = () => {
      socket.emit('enableGeneratedTheme', enableGeneratedTheme.checked);
    };

    useMotifGenerator.onchange = () => {
      socket.emit('useMotifGenerator', useMotifGenerator.checked);
    };

  </script>
</body>
</html>
